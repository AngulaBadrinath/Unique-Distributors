name: Production CD (AWS OIDC + SSM)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ujw-production
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release (Tests & Build Gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, bcmath, intl, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Install NPM Dependencies
        run: npm ci

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Frontend Static Analysis & Build
        run: |
          npm run type-check
          npm run build

      - name: Execute Automated Regression Test Suite
        env:
          APP_KEY: base64:2fl+Ktvkfl+Fuz4Qp/1SeEuLTUMgqG/4S5xKZe8v80o=
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          php artisan test --testsuite=Domain
          php artisan test tests/Feature/Prompt2TargetedRemediationTest.php
          php artisan test tests/Feature/Security/UserLifecyclePostgresConstraintTest.php
          php artisan test tests/Feature/Auth/PermissionRegistryTest.php
          php artisan test tests/Feature/Document/InvoiceGenerationTest.php
          php artisan test tests/Feature/Adjustment/AdminAdjustmentApplicationTest.php

  deploy-production:
    name: Deploy to Production (AWS OIDC + SSM)
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    needs: [validate-release]

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_UJW_DEPLOY_ROLE_ARN || 'arn:aws:iam::122979784839:role/GitHubActions-UJW-Production-Deploy' }}
          role-session-name: GitHubActions-UJW-Production-Deploy
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Verifying AWS caller identity..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated AWS Account: ${ACCOUNT_ID}"
          if [ "${ACCOUNT_ID}" != "122979784839" ]; then
            echo "[ERROR] Unexpected AWS Account ID: ${ACCOUNT_ID} (Expected: 122979784839)" >&2
            exit 1
          fi

      - name: Execute Production Deployment via AWS SSM
        run: |
          chmod +x scripts/run-ssm-deployment.sh scripts/deploy-production.sh
          ./scripts/run-ssm-deployment.sh "${{ vars.UJW_EC2_INSTANCE_ID || 'i-04b5a0903d590e029' }}" "${{ github.sha }}" "${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Verify Live Production Endpoints
        run: |
          echo "Verifying live production endpoints..."
          curl -fsS --max-time 15 https://uniquejerseywholesale.com/health
          echo ""
          curl -fsS --max-time 15 https://uniquejerseywholesale.com/ready
          echo ""
          echo "Production deployment and verification completed successfully."
