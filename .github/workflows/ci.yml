name: Parallel CI & CD Quality Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  backend-tests:
    name: Backend Tests (PHP 8.4 & PostgreSQL 17)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wdms_test
          POSTGRES_USER: wdms_user
          POSTGRES_PASSWORD: wdms_secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, zip, bcmath, intl, pdo_sqlite, sqlite3
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --optimize-autoloader

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations Against PostgreSQL 17
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wdms_test
          DB_USERNAME: wdms_user
          DB_PASSWORD: wdms_secret
        run: php artisan migrate --force

      - name: Execute Domain Invariant Tests
        run: php artisan test --testsuite=Domain

      - name: Execute API & Security Tests
        run: php artisan test --testsuite=API

      - name: Execute Database & Accounting Invariant Tests
        run: php artisan test --testsuite=Database

  frontend-build:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Analysis
        run: npm run type-check

      - name: Vite Production Build
        run: npm run build

  playwright-parallel-shards:
    name: Playwright Shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wdms_test
          POSTGRES_USER: wdms_user
          POSTGRES_PASSWORD: wdms_secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup PHP & Node.js
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, zip, bcmath, intl, pdo_sqlite, sqlite3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install PHP & Node Dependencies
        run: |
          composer install --prefer-dist --no-interaction
          npm ci

      - name: Install Playwright Browsers (CI Headless Chromium)
        run: npx playwright install chromium --with-deps

      - name: Start Application Server
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wdms_test
          DB_USERNAME: wdms_user
          DB_PASSWORD: wdms_secret
          CACHE_STORE: redis
          SESSION_DRIVER: redis
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          cp .env.example .env
          php artisan key:generate
          sed -i 's/DB_PORT=5433/DB_PORT=5432/g' .env
          sed -i 's/DB_PASSWORD=your_db_password_here/DB_PASSWORD=wdms_secret/g' .env
          sed -i 's/REDIS_PORT=6380/REDIS_PORT=6379/g' .env
          sed -i 's/REDIS_PASSWORD=your_redis_password_here/REDIS_PASSWORD=/g' .env
          php artisan migrate --seed --force
          npm run build
          php artisan serve --host=127.0.0.1 --port=8000 &
          timeout 30 bash -c 'until curl -s http://127.0.0.1:8000/health; do sleep 1; done' || true

      - name: Execute Playwright Shard
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
          HEADLESS: 'true'
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: Upload Shard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ strategy.job-index }}
          path: artifacts/test-results/
          retention-days: 7

  release-coverage-gate:
    name: Central Aggregation & 909/909 Gate
    runs-on: ubuntu-latest
    needs: [playwright-parallel-shards]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Aggregate Parallel Results
        run: node scripts/aggregate-parallel-results.js

      - name: Execute Master Checklist Coverage Gate
        run: node scripts/validate-coverage-gate.js

      - name: AI Diagnostic Health Verification
        run: node scripts/ai-failure-triage.js

  deploy-production:
    name: Deploy to Production (AWS OIDC + SSM)
    runs-on: ubuntu-latest
    needs: [release-coverage-gate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    concurrency:
      group: ujw-production
      cancel-in-progress: false
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-to-assume: ${{ vars.AWS_UJW_DEPLOY_ROLE_ARN || 'arn:aws:iam::122979784839:role/GitHubActions-UJW-Production-Deploy' }}
          role-session-name: GitHubActions-UJW-Production-Deploy
          audience: sts.amazonaws.com

      - name: Verify AWS Identity
        run: |
          echo "Verifying AWS caller identity..."
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text)
          echo "Authenticated AWS Account: ${ACCOUNT_ID}"
          if [ "${ACCOUNT_ID}" != "122979784839" ]; then
            echo "[ERROR] Unexpected AWS Account ID: ${ACCOUNT_ID} (Expected: 122979784839)" >&2
            exit 1
          fi

      - name: Execute Production Deployment via AWS SSM
        run: |
          chmod +x scripts/run-ssm-deployment.sh
          ./scripts/run-ssm-deployment.sh "${{ vars.UJW_EC2_INSTANCE_ID || 'i-04b5a0903d590e029' }}" "${{ github.sha }}" "${{ vars.AWS_REGION || 'us-east-1' }}"

      - name: Verify Live Production Endpoints
        run: |
          echo "Verifying live production endpoints..."
          curl -fsS --max-time 15 https://uniquejerseywholesale.com/health
          echo ""
          curl -fsS --max-time 15 https://uniquejerseywholesale.com/ready
          echo ""
          echo "Production deployment and verification completed successfully."
